<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-red: #ff4d4d;
            --accent-green: #4CAF50;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .card-container {
            width: 90%;
            max-width: 350px;
            height: 500px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .genre {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 28px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card .year {
            font-size: 16px;
            color: var(--text-dim);
            margin-bottom: 20px;
        }

        .card .description {
            font-size: 15px;
            line-height: 1.5;
            color: #ddd;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 50px;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:active { transform: scale(0.9); }
        .btn-dislike { background-color: var(--accent-red); }
        .btn-like { background-color: var(--accent-green); }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
    </style>
</head>
<body>

    <div class="card-container" id="card-container">
        <!-- Карточка будет вставляться сюда -->
    </div>

    <div class="controls">
        <button class="btn btn-dislike" onclick="swipeLeft()">❌</button>
        <button class="btn btn-like" onclick="swipeRight()">❤️</button>
    </div>

    <div class="match-overlay" id="match-overlay">
        <h1>🎬 IT'S A MATCH!</h1>
        <p>Added to your potential watchlist</p>
        <button onclick="closeMatch()" style="padding: 12px 30px; border-radius: 20px; border: none; background: white; cursor: pointer; font-weight: bold;">Continue</button>
    </div>

    <script>
        // Наша база данных (в будущем мы заменим это на API запрос)
        const movies = [
            { title: "Inception", year: "2010", genre: "Sci-Fi", desc: "A thief who steals secrets through dreams puts the security of your own mind at risk." },
            { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty transfers control to his son." },
            { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A young girl wanders into a world ruled by gods, spirits, and monsters." },
            { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole in space in search of a new home for humanity." },
            { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination collide in this dark comedy-thriller." },
            { title: "The Dark Knight", year: "2008", genre: "Action", desc: "Batman faces his greatest psychological challenge against the Joker." },
            { title: "Everything Everywhere All At Once", year: "2022", genre: "Adventure", desc: "An extraordinary woman is swept up in a multiversal adventure." }
        ];

        let currentIndex = 0;
        const container = document.getElementById('card-container');

        // Функция отрисовки новой карточки
        function renderCard() {
            // Очищаем контейнер
            container.innerHTML = '';

            if (currentIndex >= movies.length) {
                container.innerHTML = `
                    <div class="card">
                        <div class="genre">Finished</div>
                        <h2>No more movies!</h2>
                        <p>You've reached the end of the current list.</p>
                    </div>`;
                return;
            }

            const movie = movies[currentIndex];

            // Создаем элемент карточки
            const card = document.createElement('div');
            card.className = 'card';
            
            // Используем шаблонную строку для вставки данных
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            
            container.appendChild(card);
        }

        // Логика кнопок
        function swipeLeft() {
            currentIndex++;
            renderCard();
        }

        function swipeRight() {
            const overlay = document.getElementById('match-overlay');
            overlay.style.display = 'flex';
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
            currentIndex++;
            renderCard();
        }

        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран телефона

        // Первая отрисовка при загрузке
        renderCard();
    </script>
</body>
</html>
