<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card-container {
            position: relative;
            width: 90%;
            max-width: 350px;
            height: 500px;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border-radius: 20px;
            border: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.3s, opacity 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card h2 { font-size: 24px; margin-bottom: 10px; color: #ff4d4d; }
        .card p { font-size: 14px; color: #ccc; line-height: 1.4; }
        .card .genre { color: #4CAF50; font-weight: bold; margin-bottom: 20px; }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 40px;
        }

        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.9); }
        .btn-dislike { background-color: #ff4d4d; }
        .btn-like { background-color: #4CAF50; }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="card-container" id="card-container">
        <!-- Карточки будут генерироваться здесь -->
    </div>

    <div class="controls">
        <button class="btn btn-dislike" onclick="swipeLeft()">❌</button>
        <button class="btn btn-like" onclick="swipeRight()">❤️</button>
    </div>

    <div class="match-overlay" id="match-overlay">
        <h1>🎬 IT'S A MATCH!</h1>
        <p>Add it to your watchlist</p>
        <button onclick="closeMatch()" style="padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer;">Continue</button>
    </div>

    <script>
        // База данных из наших подборок
        const movies = [
            { title: "Inception", year: "2010", genre: "Sci-Fi", desc: "A thief who steals secrets through dreams." },
            { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty." },
            { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A girl wanders into a world of spirits." },
            { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole." },
            { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination in modern Korea." }
        ];

        let currentIndex = 0;
        const container = document.getElementById('card-container');

        function renderCard() {
            container.innerHTML = '';
            if (currentIndex >= movies.length) {
                container.innerHTML = '<div class="card"><h2>No more movies!</h2><p>You've seen them all.</p></div>';
                return;
            }

            const movie = movies[currentIndex];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <p>(${movie.year})</p>
                <p>${movie.desc}</p>
            `;
            container.appendChild(card);
        }

        function swipeLeft() {
            currentIndex++;
            renderCard();
        }

        function swipeRight() {
            const overlay = document.getElementById('match-overlay');
            overlay.style.display = 'flex';
            // Здесь можно добавить логику сохранения в БД
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
            currentIndex++;
            renderCard();
        }

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        renderCard();
    </script>
</body>
</html>
