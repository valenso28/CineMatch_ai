<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI - Duel Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-green: #4CAF50;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .duel-container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
            height: 450px;
        }

        .card {
            position: relative;
            flex: 1;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform var(--transition-speed) ease-out, opacity var(--transition-speed) ease-out;
            cursor: pointer;
            user-select: none;
        }

        /* Эффект при нажатии на карточку */
        .card:active {
            transform: scale(0.95);
            border-color: var(--accent-green);
        }

        /* Анимации улетания */
        .fly-away {
            transform: translateY(-100px) rotate(20deg) scale(0.8) !important;
            opacity: 0;
            pointer-events: none;
        }

        .genre {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .card h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card .year {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .card .description {
            font-size: 13px;
            line-height: 1.4;
            color: #ddd;
        }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
        .match-overlay button {
            padding: 12px 30px;
            border-radius: 20px;
            border: none;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body class="tg-app">

    <div class="duel-container" id="duel-container">
        <!-- Карточки будут здесь -->
    </div>

    <div class="match-overlay" id="match-overlay">
        <h1>🎬 FINAL CHOICE!</h1>
        <p>The winner is selected.</p>
        <button onclick="closeMatch()">Start Movie</button>
    </div>

    <script>
        // База данных
        const movies = [
            { title: "Inception", year: "2010", genre: "Sci-Fi", desc: "A thief who steals secrets through dreams." },
            { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty." },
            { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A girl wanders into a world of spirits." },
            { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole." },
            { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination in modern Korea." },
            { title: "The Dark Knight", year: "2008", genre: "Action", desc: "Batman faces his greatest challenge against the Joker." },
            { title: "Everything Everywhere", year: "2022", genre: "Adventure", desc: "An extraordinary woman is swept up in a multiversal adventure." },
            { title: "Pulp Fiction", year: "1993", genre: "Crime", desc: "The lives of two mob hitmen, a boxer, and a pair of criminals." },
            { title: "Dune", year: "2021", genre: "Sci-Fi", desc: "A noble family thrown into the center of a galactic war." },
            { title: "Gladiator", year: "2000", genre: "Drama", desc: "A former and glorious general sets out to exact vengeance." },
            { title: "Matrix", year: "1999", genre: "Sci-Fi", desc: "A hacker learns the truth about his reality." },
            { title: "Titanic", year: "1997", genre: "Drama", desc: "A tragic romance on the ill-fated ship." }
        ];

        let currentIndex = 0; // Индекс первого фильма в дуэли
        const container = document.getElementById('duel-container');

        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            // Добавляем обработчик клика
            card.onclick = () => handleSelection(card);
            return card;
        }

        function renderDuel() {
            container.innerHTML = '';
            
            // Проверка окончания списка
            if (currentIndex >= movies.length - 1) {
                container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>No more movies!</h2><p>You've found your match.</p></div>`;
                return;
            }

            // Рисуем две карточки
            const card1 = createCardElement(movies[currentIndex]);
            const card2 = createCardElement(movies[currentIndex + 1]);
            
            container.appendChild(card1);
            container.appendChild(card2);
        }

        function handleSelection(clickedCard) {
            const allCards = container.querySelectorAll('.card');
            // Находим карточку, которая НЕ была нажата
            const otherCard = Array.from(allCards).find(c => c !== clickedCard);

            if (otherCard) {
                // Анимируем улет проигравшей карточки
                otherCard.classList.add('fly-away');

                // Через время анимации обновляем список
                setTimeout(() => {
                    otherCard.remove();
                    
                    // Логика "Битвы": 
                    // Если мы выбрали первый фильм (0), второй (1) улетает.
                    // Чтобы дуэль продолжилась, мы должны оставить выбранный фильм (0)
                    // и подтянуть новый фильм в позицию (1).
                    
                    // Простая реализация для MVP:
                    // Мы просто сдвигаем список дальше.
                    // Если хочешь сложный турнир, здесь нужна будет логика "отсеивания"
                    currentIndex++;
                    renderDuel();
                }, 400);
            }
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
        }

        const tg = window.Telegram.WebApp;
        tg.expand();

        renderDuel();
    </script>
</body>
</html>
