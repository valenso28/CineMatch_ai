<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-green: #4CAF50;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Общий стиль для экранов */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        /* Стартовый экран */
        .home-title {
            font-size: 32px;
            margin-bottom: 40px;
            background: linear-gradient(to right, #4CAF50, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            padding: 30px 10px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-btn.primary {
            grid-column: span 2;
            background: linear-gradient(145deg, #2e7d32, #4CAF50);
            border: none;
            margin-bottom: 10px;
        }

        .menu-btn:active {
            transform: scale(0.95);
            background: #333;
        }

        /* Турнирный экран (наш старый движок) */
        .duel-container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
            height: 450px;
        }

        .card {
            position: relative;
            flex: 1;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform var(--transition-speed) ease-out, opacity var(--transition-speed) ease-out;
            cursor: pointer;
            user-select: none;
        }

        .card:active { transform: scale(0.95); border-color: var(--accent-green); }
        .fly-away { transform: translateY(-100px) rotate(20deg) scale(0.8) !important; opacity: 0; }

        .genre { font-size: 10px; text-transform: uppercase; color: var(--accent-green); margin-bottom: 8px; }
        .card h2 { font-size: 22px; margin: 0 0 10px 0; }
        .card .year { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; }
        .card .description { font-size: 13px; line-height: 1.4; color: #ddd; }

        /* Личный кабинет */
        .cabinet-list {
            width: 100%;
            max-width: 400px;
            text-align: left;
            padding: 20px;
        }

        .cabinet-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }

        /* Навигационная панель */
        .nav-bar {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid white;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
        .match-overlay button { padding: 12px 30px; border-radius: 20px; border: none; background: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body class="tg-app">

    <!-- ЭКРАН 1: ДОМ -->
    <div id="screen-home" class="screen active">
        <h1 class="home-title">CineMatch AI</h1>
        <div class="menu-grid">
            <button class="menu-btn primary" onclick="showDuel('top100')">🏆 Top 100 of 20th Century</button>
            <button class="menu-btn" onclick="showDuel('drama')">🎭 Drama</button>
            <button class="menu-btn" onclick="showDuel('scifi')">🚀 Sci-Fi</button>
            <button class="menu-btn" onclick="showDuel('thriller')">😱 Thriller</button>
            <button class="menu-btn" onclick="showCabinet()">👤 My Cabinet</button>
        </div>
    </div>

    <!-- ЭКРАН 2: ТУРНИР -->
    <div id="screen-duel" class="screen">
        <div class="duel-container" id="duel-container"></div>
    </div>

    <!-- ЭКРАН 3: КАБИНЕТ -->
    <div id="screen-cabinet" class="screen">
        <h2 style="color: var(--accent-green);">My Favorites</h2>
        <div class="cabinet-list" id="cabinet-list">
            <p>No favorites yet.</p>
        </div>
        <button class="menu-btn" style="margin-top: 20px;" onclick="showHome()">Back Home</button>
    </div>

    <!-- Оверлей матча -->
    <div class="match-overlay" id="match-overlay">
        <h1>🎬 FINAL CHOICE!</h1>
        <p id="winner-name"></p>
        <button onclick="closeMatch()">Start Movie</button>
    </div>

    <script>
        // База данных (Временно используем заглушки)
       const movieDatabase = {
    top100: [
        { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty." },
        { title: "Schindler's List", year: "1993", genre: "Drama", desc: "A real-life story of heroism." },
        { title: "Pulp Fiction", year: "1993", genre: "Crime", desc: "The lives of two mob hitmen, a boxer, and a pair of criminals." },
        { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination in modern Korea." },
        { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole in space." },
        { title: "The Dark Knight", year: "2008", genre: "Action", desc: "Batman faces his greatest challenge against the Joker." },
        { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A young girl wanders into a world of spirits." },
        { title: "Gladiator", year: "2000", genre: "Drama", desc: "A former and glorious general sets out to exact vengeance." },
        { title: "Goodfellas", year: "1990", genre: "Crime", desc: "The true story of the rise and fall of the Lucchese crime family." },
        { title: "Everything Everywhere", year: "2022", genre: "Adventure", desc: "An extraordinary woman is swept up in a multiversal adventure." }
        // Добавим остальные из Топ-100 во втором блоке
    ],
    drama: [
        { title: "Manchester by the Sea", year: "2016", genre: "Drama", desc: "A man struggles with his past after a tragedy." },
        { title: "The Whale", year: "2022", genre: "Drama", desc: "A reclusive man prepares for a final act." },
        { title: "Moonlight", year: "2016", genre: "Drama", desc: "A complex coming-of-age story." },
        { title: "Roma", year: "2018", genre: "Drama", desc: "A sweeping portrait of a family in Mexico City." },
        { title: "La La Land", year: "2016", genre: "Drama", desc: "A jazz pianist and an aspiring actress fall in love." }
    ],
    scifi: [
        { title: "Blade Runner 2049", year: "2017", genre: "Sci-Fi", desc: "A young blade runner unearths a long-buried secret." },
        { title: "Arrival", year: "2016", genre: "Sci-Fi", desc: "A linguist works to communicate with alien visitors." },
        { title: "Dune", year: "2021", genre: "Sci-Fi", desc: "A noble family thrown into the center of a galactic war." },
        { title: "The Matrix", year: "1999", genre: "Sci-Fi", desc: "A hacker learns the truth about his reality." },
        { title: "Gravity", year: "2013", genre: "Sci-Fi", desc: "An astronaut must survive in outer space." }
    ],
    thriller: [
        { title: "Se7en", year: "1995", genre: "Thriller", desc: "Two detectives hunt a serial killer." },
        { title: "The Prestige", year: "2006", genre: "Thriller", desc: "Two rival magicians compete for the ultimate trick." },
        { title: "Shutter Island", year: "2010", genre: "Thriller", desc: "A marshal investigates a disappearance at a mental hospital." },
        { title: "Memento", year: "2000", genre: "Thriller", desc: "A man with short-term memory loss tries to find his wife's killer." },
        { title: "Sicario", year: "2015", genre: "Thriller", desc: "An agent-in-training joins an elite task force." }
    ]
};


        let currentDuelList = [];
        let winnerMovie = null;
        let challengerMovie = null;
        let nextIdx = 0;

        // Навигация
        function showHome() {
            hideAll();
            document.getElementById('screen-home').classList.add('active');
        }

        function showCabinet() {
            hideAll();
            const list = document.getElementById('cabinet-list');
            const favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            
            if (favorites.length === 0) {
                list.innerHTML = '<p>No favorites yet.</p>';
            } else {
                list.innerHTML = favorites.map(f => `
                    <div class="cabinet-item">
                        <strong>${f.title}</strong> (${f.year})<br>
                        <small style="color: #888">${f.genre}</small>
                    </div>
                `).join('');
            }
            document.getElementById('screen-cabinet').classList.add('active');
        }

        function showDuel(category) {
            hideAll();
            currentDuelList = movieDatabase[category];
            nextIdx = 0;
            
            // Выбираем первые два фильма для начала дуэли
            winnerMovie = currentDuelList[0];
            challengerMovie = currentDuelList[1];
            
            renderDuelTournament();
            document.getElementById('screen-duel').classList.add('active');
        }

        function hideAll() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        }

        // Турнирная логика
        const container = document.getElementById('duel-container');

        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            return card;
        }

        function renderDuelTournament() {
            container.innerHTML = '';
            if (winnerMovie && challengerMovie) {
                const c1 = createCardElement(winnerMovie);
                const c2 = createCardElement(challengerMovie);
                container.appendChild(c1);
                container.appendChild(c2);
                
                c1.onclick = () => {
                    c2.classList.add('fly-away');
                    setTimeout(() => {
                        c2.remove();
                        nextIdx++;
                        if (nextIdx < currentDuelList.length) {
                            challengerMovie = currentDuelList[nextIdx];
                            renderDuelTournament();
                        } else {
                            showFinal(winnerMovie);
                        }
                    }, 400);
                };

                c2.onclick = () => {
                    c1.classList.add('fly-away');
                    setTimeout(() => {
                        c1.remove();
                        nextIdx++;
                        if (nextIdx < currentDuelList.length) {
                            winnerMovie = currentDuelList[nextIdx];
                            renderDuelTournament();
                        } else {
                            showFinal(challengerMovie);
                        }
                    }, 400);
                };
            }
        }

        function showFinal(movie) {
            container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>${movie.title}</h2><p>You've found your match!</p></div>`;
            setTimeout(() => {
                document.getElementById('match-overlay').style.display = 'flex';
                document.getElementById('winner-name').innerText = movie.title;
            }, 500);
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
            showHome();
        }

        const tg = window.Telegram.WebApp;
        tg.expand();
        showHome();
    </script>
</body>
</html>
