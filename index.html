<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI - Tournament Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-green: #4CAF50;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .duel-container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
            height: 450px;
        }

        .card {
            position: relative;
            flex: 1;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform var(--transition-speed) ease-out, opacity var(--transition-speed) ease-out;
            cursor: pointer;
            user-select: none;
        }

        /* Эффект при нажатии */
        .card:active {
            transform: scale(0.95);
            border-color: var(--accent-green);
        }

        /* Анимация улетания */
        .fly-away {
            transform: translateY(-100px) rotate(20deg) scale(0.8) !important;
            opacity: 0;
        }

        .genre {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .card h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card .year {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .card .description {
            font-size: 13px;
            line-height: 1.4;
            color: #ddd;
        }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
        .match-overlay button {
            padding: 12px 30px;
            border-radius: 20px;
            border: none;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body class="tg-app">

    <div class="duel-container" id="duel-container">
        <!-- Карточки будут здесь -->
    </div>

    <div class="match-overlay" id="match-overlay">
        <h1>🎬 FINAL CHOICE!</h1>
        <p>The winner is selected.</p>
        <button onclick="closeMatch()">Start Movie</button>
    </div>

    <script>
        const movies = [
            { title: "Inception", year: "2010", genre: "Sci-Fi", desc: "A thief who steals secrets through dreams." },
            { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty." },
            { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A girl wanders into a world of spirits." },
            { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole." },
            { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination in modern Korea." },
            { title: "The Dark Knight", year: "2008", genre: "Action", desc: "Batman faces his greatest challenge against the Joker." },
            { title: "Everything Everywhere", year: "2022", genre: "Adventure", desc: "An extraordinary woman is swept up in a multiversal adventure." },
            { title: "Pulp Fiction", year: "1993", genre: "Crime", desc: "The lives of two mob hitmen, a boxer, and a pair of criminals." },
            { title: "Dune", year: "2021", genre: "Sci-Fi", desc: "A noble family thrown into the center of a galactic war." },
            { title: "Gladiator", year: "2000", genre: "Drama", desc: "A former and glorious general sets out to exact vengeance." },
            { title: "Matrix", year: "1999", genre: "Sci-Fi", desc: "A hacker learns the truth about his reality." },
            { title: "Titanic", year: "1997", genre: "Drama", desc: "A tragic romance on the ill-fated ship." }
        ];

        let poolIndex = 2; // Откуда берем новые фильмы
        const container = document.getElementById('duel-container');

        // Создаем DOM-элемент карточки
        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            return card;
        }

        // Отрисовка двух карточек
        function renderDuel(m1, m2) {
            container.innerHTML = '';
            
            if (!m1 && !m2) {
                container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>No more movies!</h2><p>You've found your match.</p></div>`;
                return;
            }

            if (m1) container.appendChild(createCardElement(m1));
            if (m2) container.appendChild(createCardElement(m2));
        }

        // Обработка выбора
        function handleSelection(clickedCard) {
            const cards = container.querySelectorAll('.card');
            const otherCard = Array.from(cards).find(c => c !== clickedCard);

            if (otherCard) {
                // 1. Анимируем улет проигравшей карточки
                otherCard.classList.add('fly-away');

                // 2. Ждем завершения анимации
                setTimeout(() => {
                    otherCard.remove();
                    
                    // 3. Логика "Турнира"
                    // Мы должны оставить выбранную карточку и заменить улетевшую на новую из списка.
                    // Если список кончился, а карточек на экране еще 2 — показываем финальный результат.
                    
                    if (poolIndex < movies.length) {
                        // Добавляем новую карточку в пустую позицию (справа или слева)
                        // Для простоты MVP: просто обновляем дуэль следующими фильмами
                        // Но так как ты хочешь оставить выбранную — мы просто "подставляем" новый фильм вместо улетевшего.
                        
                        // Определяем, куда вставить новую карточку
                        // (Если улетела правая — вставляем вправо, если левая — влево)
                        const cardsAfterRemoval = container.querySelectorAll('.card');
                        
                        // Но самая простая и надежная логика для турнира:
                        // Если мы нажали на левую, правая улетела. Мы ставим на ее место следующий из массива.
                        // Если нажали на правую, левая улетела. Мы ставим на ее место следующий из массива.
                        
                        // Реализуем это через обновление массива текущей дуэли
                        // (Для MVP просто обновим текущий индекс и перерисуем всё, 
                        // сохранив "победителя" в памяти)
                        // Но сейчас мы сделаем проще: просто добавим новый фильм в то место, где была карточка.
                        
                        // Давай просто обновим индекс и перерисуем, сохранив выбранную карточку
                        // Но чтобы не усложнять код, мы используем такой хак:
                        // Мы просто создаем новую пару, где одна из них — та, которую ты выбрал.
                        
                        // В данном случае, чтобы выборка была корректной, 
                        // мы просто двигаем индекс и рендерим следующую пару.
                        poolIndex++; 
                        // Но чтобы выборная оставалась, нам нужно хранить её.
                        // Давай упростим: нажми на одну -> вторая исчезла -> новая пара из списка.
                        // Если тебе нужно, чтобы именно СТАРАЯ карточка оставалась, 
                        // мы добавим переменную `currentWinner`.
                    }
                }, 400);
            }
        }

        // --- УЛУЧШЕННАЯ ЛОГИКА ДЛЯ ТВОЕГО ЗАПРОСА ---
        let winnerMovie = movies[0];
        let challengerMovie = movies[1];
        let nextMovieIdx = 2;

        function renderDuelTournament() {
            container.innerHTML = '';
            
            if (winnerMovie && challengerMovie) {
                const c1 = createCardElement(winnerMovie);
                const c2 = createCardElement(challengerMovie);
                container.appendChild(c1);
                container.appendChild(c2);
                
                c1.onclick = () => {
                    c2.classList.add('fly-away');
                    setTimeout(() => {
                        c2.remove();
                        if (nextMovieIdx < movies.length) {
                            challengerMovie = movies[nextMovieIdx];
                            nextMovieIdx++;
                            renderDuelTournament();
                        } else {
                            // Финал!
                            showFinalMatch(winnerMovie);
                        }
                    }, 400);
                };

                c2.onclick = () => {
                    c1.classList.add('fly-away');
                    setTimeout(() => {
                        c1.remove();
                        if (nextMovieIdx < movies.length) {
                            winnerMovie = movies[nextMovieIdx];
                            nextMovieIdx++;
                            renderDuelTournament();
                        } else {
                            showFinalMatch(challengerMovie);
                        }
                    }, 400);
                };
            }
        }

        function showFinalMatch(finalMovie) {
            container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>${finalMovie.title}</h2><p>You've made your choice!</p></div>`;
            setTimeout(() => {
                document.getElementById('match-overlay').style.display = 'flex';
                document.getElementById('winner-name').innerText = finalMovie.title;
            }, 500);
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
        }

        const tg = window.Telegram.WebApp;
        tg.expand();

        renderDuelTournament();
    </script>
</body>
</html>
