<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI - Duel Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-red: #ff4d4d;
            --accent-green: #4CAF50;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Контейнер для двух карточек */
        .duel-container {
            display: flex;
            gap: 15px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
            height: 500px;
        }

        .card {
            position: relative;
            flex: 1;
            height: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform var(--transition-speed) ease-out, opacity var(--transition-speed) ease-out;
        }

        /* Анимации */
        .fly-away {
            transform: translateY(-100px) rotate(20deg) scale(0.8) !important;
            opacity: 0;
        }

        .genre {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .card h2 {
            font-size: 20px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card .year {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .card .description {
            font-size: 13px;
            line-height: 1.4;
            color: #ccc;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white; /* Добавили белый контур для читаемости */
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn:active { transform: scale(0.9); }
        .btn-dislike { background-color: var(--accent-red); }
        .btn-like { background-color: var(--accent-green); }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
        .match-overlay button {
            padding: 12px 30px;
            border-radius: 20px;
            border: none;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body class="tg-app">

    <div class="duel-container" id="duel-container">
        <!-- Карточки будут здесь -->
    </div>

    <div class="controls">
        <button class="btn btn-dislike" onclick="choose(0)" title="Keep Left">⬅️</button>
        <button class="btn btn-like" onclick="choose(1)" title="Keep Right">➡️</button>
    </div>

    <div class="match-overlay" id="match-overlay">
        <h1>🎬 FINAL CHOICE!</h1>
        <p id="winner-name"></p>
        <button onclick="closeMatch()">Start Movie</button>
    </div>

    <script>
        const movies = [
            { title: "Inception", year: "2010", genre: "Sci-Fi", desc: "A thief who steals secrets through dreams." },
            { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty." },
            { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A girl wanders into a world of spirits." },
            { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole." },
            { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination in modern Korea." },
            { title: "The Dark Knight", year: "2008", genre: "Action", desc: "Batman faces his greatest challenge against the Joker." },
            { title: "Everything Everywhere", year: "2022", genre: "Adventure", desc: "An extraordinary woman is swept up in a multiversal adventure." },
            { title: "Pulp Fiction", year: "1993", genre: "Crime", desc: "The lives of two mob hitmen, a boxer, and a pair ofless-than-glamorous criminals." },
            { title: "Dune", year: "2021", genre: "Sci-Fi", desc: "A noble family thrown into the center of a galactic war." },
            { title: "Gladiator", year: "2000", genre: "Drama", desc: "A former and glorious general sets out to exact vengeance." }
        ];

        let currentIndex = 0;
        const container = document.getElementById('duel-container');

        function createCard(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            return card;
        }

        function renderDuel() {
            container.innerHTML = '';
            
            if (currentIndex >= movies.length - 1) {
                container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>Winner Found!</h2><p>Check your choice.</p></div>`;
                return;
            }

            // Создаем две карточки для дуэли
            const card1 = createCard(movies[currentIndex]);
            const card2 = createCard(movies[currentIndex + 1]);
            
            container.appendChild(card1);
            container.appendChild(card2);
        }

        function choose(side) {
            const cards = container.querySelectorAll('.card');
            if (cards.length < 2) return;

            const toRemove = (side === 0) ? cards[1] : cards[0];
            
            // Анимация улетания той, которую не выбрали
            toRemove.classList.add('fly-away');

            setTimeout(() => {
                toRemove.remove();
                // Логика: если выбрали левую (0), значит правая (1) удалилась.
                // Но чтобы сохранить дуэль, нам нужно "дозаполнить" пустое место
                // и подготовить следующую пару.
                
                // В нашей системе "Выживания":
                // Если выбрали Левую, она остается. Нам нужно добавить новый фильм в правую позицию.
                // Если выбрали Правую, она остается. Нам нужно добавить новый фильм в левую позицию.
                
                // Для простоты: мы просто двигаем индекс дальше по списку.
                // Но так как это "турнир", мы будем просто обновлять дуэль следующими двумя фильмами.
                currentIndex++;
                renderDuel();
            }, 400);
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
        }

        const tg = window.Telegram.WebApp;
        tg.expand();

        renderDuel();
    </script>
</body>
</html>
