<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-green: #4CAF50;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .home-title {
            font-size: 32px;
            margin-bottom: 40px;
            background: linear-gradient(to right, #4CAF50, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            padding: 30px 10px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-btn.primary {
            grid-column: span 2;
            background: linear-gradient(145deg, #2e1d32, #4CAF50);
            border: none;
            margin-bottom: 10px;
        }

        .menu-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .menu-btn:active:not(:disabled) {
            transform: scale(0.95);
            background: #333;
        }

        .duel-container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
            height: 450px;
        }

        .card {
            position: relative;
            flex: 1;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform var(--transition-speed) ease-out, opacity var(--transition-speed) ease-out;
            cursor: pointer;
            user-select: none;
        }

        .card:active {
            transform: scale(0.95);
            border-color: var(--accent-green);
        }

        .fly-away {
            transform: translateY(-100px) rotate(20deg) scale(0.8) !important;
            opacity: 0;
        }

        .genre {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .card h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card .year {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .card .description {
            font-size: 13px;
            line-height: 1.4;
            color: #ddd;
        }

        .cabinet-list {
            width: 100%;
            max-width: 400px;
            text-align: left;
            padding: 20px;
        }

        .cabinet-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #cabinet-search {
            width: 80%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #222;
            color: white;
            margin-bottom: 20px;
            outline: none;
        }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
        .match-overlay button {
            padding: 15px 30px;
            border-radius: 20px;
            border: none;
            background: white;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body class="tg-app">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
        <h1 class="home-title">CineMatch AI</h1>
        <div class="menu-grid" id="menu-grid">
            <button class="menu-btn primary" onclick="showDuel('top100')">🏆 Top 100 of 20th Century</button>
            <button class="menu-btn" onclick="showDuel('drama')">🎭 Drama</button>
            <button class="menu-btn" onclick="showDuel('scifi')">🚀 Sci-Fi</button>
            <button class="menu-btn" onclick="showDuel('thriller')">😱 Thriller</button>
            <button class="menu-btn" onclick="showCabinet()">👤 My Cabinet</button>
        </div>
    </div>

    <!-- DUEL SCREEN -->
    <div id="screen-duel" class="screen">
        <div class="duel-container" id="duel-container">
            <p>Loading movies...</p>
        </div>
    </div>

    <!-- CABINET SCREEN -->
    <div id="screen-cabinet" class="screen">
        <h2 style="color: var(--accent-green);">My Favorites</h2>
        <input type="text" id="cabinet-search" placeholder="Search movies..." oninput="renderCabinetList()">
        <div class="cabinet-list" id="cabinet-list"></div>
        <button class="menu-btn" style="margin-top: 20px;" onclick="showHome()">Back Home</button>
    </div>

    <!-- OVERLAY -->
    <div class="match-overlay" id="match-overlay">
        <h1>🎬 FINAL CHOICE!</h1>
        <p id="winner-name"></p>
        <button id="save-btn">❤️ Save to Favorites</button>
        <button onclick="closeMatch()">Skip</button>
    </div>

    <script>
        let movieDatabase = {};
        let currentWinner = null;
        let currentChallenger = null;
        let poolIndex = 0;
        let currentPool = [];

        const container = document.getElementById('duel-container');

        // 1. LOAD DATA FROM JSON
        async function initApp() {
            try {
                const response = await fetch('./movies.json');
                movieDatabase = await response.json();
                console.log("Database Loaded:", movieDatabase);
                
                // Only enable buttons after data is ready
                const buttons = document.querySelectorAll('.menu-btn');
                buttons.forEach(btn => btn.disabled = false);
                
                showHome();
            } catch (error) {
                console.error("Error loading movies:", error);
                container.innerHTML = "<p>Error loading database. Please check if movies.json exists.</p>";
            }
        }

        // UI FUNCTIONS
        function showHome() {
            hideAll();
            document.getElementById('screen-home').classList.add('active');
        }

        function showCabinet() {
            hideAll();
            const list = document.getElementById('cabinet-list');
            const searchInput = document.getElementById('cabinet-search');
            list.innerHTML = '';
            const favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            
            function renderList() {
                const query = searchInput.value.toLowerCase();
                const filtered = favorites.filter(f => 
                    f.title.toLowerCase().includes(query) || 
                    f.genre.toLowerCase().includes(query)
                );

                filtered.sort((a, b) => a.watched - b.watched);

                if (filtered.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">No matches found.</p>';
                } else {
                    list.innerHTML = filtered.map((f, index) => `
                        <div class="cabinet-item">
                            <div style="flex: 1;">
                                <strong style="color:var(--accent-green)">${f.title}</strong> (${f.year})<br>
                                <small style="color: #888">${f.genre}</small>
                            </div>
                            <button 
                                onclick="toggleWatched(${index})" 
                                style="padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; background: ${f.watched ? '#555' : '#4CAF50'}; color: white; font-weight: bold; font-size: 12px;">
                                ${f.watched ? 'Watched' : 'Watch'}
                            </button>
                        </div>
                    `).join('');
                }
            }

            searchInput.oninput = renderList;
            renderList();
            document.getElementById('screen-cabinet').classList.add('active');
        }

        function showDuel(category) {
            hideAll();
            
            if (!movieDatabase[category]) {
                alert("Category not found!");
                showHome();
                return;
            }

            currentPool = [...movieDatabase[category]];
            poolIndex = 0;
            
            if (currentPool.length >= 2) {
                currentWinner = currentPool[0];
                currentChallenger = currentPool[1];
                currentPool.splice(0, 2);
            } else if (currentPool.length === 1) {
                currentWinner = currentPool[0];
                currentChallenger = null; // Handle small lists
                currentPool = [];
            } else {
                alert("Not enough movies in this category.");
                showHome();
                return;
            }

            renderDuel();
            document.getElementById('screen-duel').classList.add('active');
        }

        function renderDuel() {
            container.innerHTML = '';
            
            if (currentWinner && currentChallenger) {
                const c1 = createCardElement(currentWinner);
                const c2 = createCardElement(currentChallenger);
                container.appendChild(c1);
                container.appendChild(c2);
                
                c1.onclick = () => {
                    c2.classList.add('fly-away');
                    setTimeout(() => {
                        c2.remove();
                        if (poolIndex < currentPool.length) {
                            currentChallenger = currentPool[poolIndex];
                            poolIndex++;
                            renderDuel();
                        } else {
                            showFinal(currentWinner);
                        }
                    }, 400);
                };

                c2.onclick = () => {
                    c1.classList.add('fly-away');
                    setTimeout(() => {
                        c1.remove();
                        if (poolIndex < currentPool.length) {
                            currentWinner = currentPool[poolIndex];
                            poolIndex++;
                            renderDuel();
                        } else {
                            showFinal(currentChallenger);
                        }
                    }, 400);
                };
            } else if (currentWinner) {
                // Handle case where only one movie remains
                container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>${currentWinner.title}</h2><p>You've found your match!</p></div>`;
                setTimeout(() => {
                    document.getElementById('match-overlay').style.display = 'flex';
                    document.getElementById('winner-name').innerText = currentWinner.title;
                }, 500);
            } else {
                container.innerHTML = "<p>No movies found in this category.</p>";
            }
        }

        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            return card;
        }

        function showFinal(movie) {
            container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>${movie.title}</h2><p>You've found your match!</p></div>`;
            setTimeout(() => {
                document.getElementById('match-overlay').style.display = 'flex';
                document.getElementById('winner-name').innerText = movie.title;
                document.getElementById('save-btn').onclick = () => {
                    saveToFavorites(movie);
                };
            }, 500);
        }

        function saveToFavorites(movie) {
            let favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            const exists = favorites.some(f => f.title === movie.title);
            
            if (!exists) {
                favorites.push({ ...movie, watched: false });
                localStorage.setItem('cineMatch_favs', JSON.stringify(favorites));
                alert("Saved to favorites!");
                showCabinet(); 
            } else {
                alert("Already in favorites!");
            }
        }

        function toggleWatched(index) {
            const searchInput = document.getElementById('cabinet-search');
            const favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            const query = searchInput.value.toLowerCase();
            
            const filtered = favorites.filter(f => 
                f.title.toLowerCase().includes(query) || 
                f.genre.toLowerCase().includes(query)
            );

            const target = filtered[index];
            const originalIdx = favorites.findIndex(f => f.title === target.title);
            
            if (originalIdx !== -1) {
                favorites[originalIdx].watched = !favorites[originalIdx].watched;
                localStorage.setItem('cineMatch_favs', JSON.stringify(favorites));
                renderCabinetList();
            }
        }

        function renderCabinetList() {
            const list = document.getElementById('cabinet-list');
            const searchInput = document.getElementById('cabinet-search');
            list.innerHTML = '';
            const favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            
            const query = searchInput.value.toLowerCase();
            const filtered = favorites.filter(f => 
                f.title.toLowerCase().includes(query) || 
                f.genre.toLowerCase().includes(query)
            );

            filtered.sort((a, b) => a.watched - b.watched);

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">No matches found.</p>';
            } else {
                list.innerHTML = filtered.map((f, index) => `
                    <div class="cabinet-item">
                        <div style="flex: 1;">
                            <strong style="color:var(--accent-green)">${f.title}</strong> (${f.year})<br>
                            <small style="color: #888">${f.genre}</small>
                        </div>
                        <button 
                            onclick="toggleWatched(${index})" 
                            style="padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; background: ${f.watched ? '#555' : '#4CAF50'}; color: white; font-weight: bold; font-size: 12px;">
                            ${f.watched ? 'Watched' : 'Watch'}
                        </button>
                    `).join('');
            }
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
            showHome();
        }

        function showHome() {
            hideAll();
            document.getElementById('screen-home').classList.add('active');
        }

        function hideAll() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        }

        const tg = window.Telegram.WebApp;
        tg.expand();

        initApp();
    </script>
</body>
</html>
