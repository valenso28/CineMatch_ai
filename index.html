<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-green: #4CAF50;
            --accent-red: #ff4d4d;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        .home-title {
            font-size: 32px;
            margin-bottom: 40px;
            background: linear-gradient(to right, #4CAF50, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            padding: 30px 10px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-btn.primary {
            grid-column: span 2;
            background: linear-gradient(145deg, #2e1d32, #4CAF50);
            border: none;
            margin-bottom: 10px;
        }

        .menu-btn:active {
            transform: scale(0.95);
            background: #333;
        }

        .duel-container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
            align-items: center;
            height: 450px;
        }

        .card {
            position: relative;
            flex: 1;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: transform var(--transition-speed) ease-out, opacity var(--transition-speed) ease-out;
            cursor: pointer;
            user-select: none;
        }

        .card:active {
            transform: scale(0.95);
            border-color: var(--accent-green);
        }

        .fly-away {
            transform: translateY(-100px) rotate(20deg) scale(0.8) !important;
            opacity: 0;
        }

        .genre {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .card h2 {
            font-size: 20px;
            margin: 0 0 10px 0;
            color: var(--text-main);
            text-align: center;
        }

        .card .year {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .card .description {
            font-size: 13px;
            line-height: 1.4;
            color: #ddd;
            padding: 0 10px;
        }

        /* Cabinet Styles */
        .cabinet-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
        }

        .cabinet-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #cabinet-search {
            width: 80%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #222;
            color: white;
            margin-bottom: 20px;
            outline: none;
        }

        .btn-action {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-watch {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent-green);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent-red);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .match-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .match-overlay h1 { color: var(--accent-green); font-size: 40px; }
        .match-overlay button {
            padding: 15px 30px;
            border-radius: 20px;
            border: none;
            background: white;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body class="tg-app">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
        <h1 class="home-title">CineMatch AI</h1>
        <div class="menu-grid">
            <button class="menu-btn primary" onclick="showDuel('top100')">🏆 Top 100 of 20th Century</button>
            <button class="menu-btn" onclick="showDuel('drama')">🎭 Drama</button>
            <button class="menu-btn" onclick="showDuel('scifi')">🚀 Sci-Fi</button>
            <button class="menu-btn" onclick="showDuel('thriller')">😱 Thriller</button>
            <button class="menu-btn" onclick="showCabinet()">👤 My Cabinet</button>
        </div>
    </div>

    <!-- DUEL SCREEN -->
    <div id="screen-duel" class="screen">
        <div class="duel-container" id="duel-container">
            <p>Loading movies...</p>
        </div>
    </div>

    <!-- CABINET SCREEN -->
    <div id="screen-cabinet" class="screen">
        <h2 style="color: var(--accent-green);">My Favorites</h2>
        <input type="text" id="cabinet-search" placeholder="Search movies..." oninput="renderCabinetList()">
        <div class="cabinet-list" id="cabinet-list"></div>
        <button class="menu-btn" style="margin-top: 20px; padding: 15px 40px;" onclick="showHome()">Back Home</button>
    </div>

    <!-- OVERLAY -->
    <div class="match-overlay" id="match-overlay">
        <h1>🎬 FINAL CHOICE!</h1>
        <p id="winner-name"></p>
        <button id="save-btn">❤️ Save to Favorites</button>
        <button onclick="closeMatch()">Skip</button>
    </div>

    <script>
        // DATABASE - Now includes poster links and descriptions
        const movieDatabase = {
            top100: [
                { title: "The Godfather", year: "1972", genre: "Crime", desc: "The aging patriarch of an organized crime dynasty transfers control to his son.", poster: "https://image.tmdb.org/t/p/w500/5673907e6301b680451b0a0462920333.jpg" },
                { title: "Schindler's List", year: "1993", genre: "Drama", desc: "A real-life story of heroism. Oskar Schindler saves Jewish-occupied Poland.", poster: "https://image.tmdb.org/t/p/w500/vXf60jC9m4pS9vUfTsq6iH9Oowk.jpg" },
                { title: "Pulp Fiction", year: "1993", genre: "Crime", desc: "The lives of two mob hitmen, a boxer, and a pair of-less-than-glamorous criminals." },
                { title: "Parasite", year: "2019", genre: "Drama", desc: "Greed and class discrimination collide in this dark comedy-thriller." },
                { title: "Interstellar", year: "2014", genre: "Sci-Fi", desc: "A team of explorers travel through a wormhole in space to find a new home." },
                { title: "The Dark Knight", year: "2008", genre: "Action", desc: "Batman faces his greatest psychological challenge against the Joker." },
                { title: "Spirited Away", year: "2001", genre: "Animation", desc: "A young girl wanders into a world ruled by gods, spirits, and monsters." },
                { title: "Gladiator", year: "2000", genre: "Drama", desc: "A former and glorious general sets out to exact vengeance." },
                { title: "Goodfellas", year: "1990", genre: "Crime", desc: "The true story of the rise and fall of the Lucchese crime family." },
                { title: "Everything Everywhere", year: "2022", genre: "Adventure", desc: "An extraordinary woman is swept up in a multiversal adventure." }
            ],
            drama: [
                { title: "Manchester by the Sea", year: "2016", genre: "Drama", desc: "A man struggles with his past after a tragedy." },
                { title: "The Whale", year: "2022", genre: "Drama", desc: "A reclusive man prepares for a final act." },
                { title: "Moonlight", year: "2016", genre: "Drama", desc: "A complex coming-of-age story." },
                { title: "Roma", year: "2018", genre: "Drama", desc: "A sweeping portrait of a family in Mexico City." },
                { title: "La La Land", year: "2016", genre: "Drama", desc: "A jazz pianist and an aspiring actress fall in love." }
            ],
            scifi: [
                { title: "Blade Runner 2049", year: "2017", genre: "Sci-Fi", desc: "A young blade runner unearths a long-buried secret." },
                { title: "Arrival", year: "2016", genre: "Sci-Fi", desc: "A linguist works to communicate with alien visitors." },
                { title: "Dune", year: "2021", genre: "Sci-Fi", desc: "A noble family thrown into the center of a galactic war." },
                { title: "The Matrix", year: "1990", genre: "Sci-Fi", desc: "A hacker learns the truth about his reality." },
                { title: "Gravity", year: "2013", genre: "Sci-Fi", desc: "An astronaut must survive in outer space." }
            ],
            thriller: [
                { title: "Se7en", year: "1995", genre: "Thriller", desc: "Two detectives hunt a serial killer." },
                { title: "The Prestige", year: "2006", genre: "Thriller", desc: "Two rival magicians compete for the ultimate trick." },
                { title: "Shutter Island", year: "2010", genre: "Thriller", desc: "A marshal investigates a disappearance at a mental hospital." },
                { title: "Memento", year: "2000", genre: "Thriller", desc: "A man with short-term memory loss tries to find his wife's killer." },
                { title: "Sicario", year: "2015", genre: "Thriller", desc: "An agent-in-training joins an elite task force." }
            ]
        };

        let currentWinner = null;
        let currentChallenger = null;
        let poolIndex = 0;
        let currentPool = [];

        const container = document.getElementById('duel-container');

        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="genre">${movie.genre}</div>
                <h2>${movie.title}</h2>
                <div class="year">(${movie.year})</div>
                <div class="description">${movie.desc}</div>
            `;
            return card;
        }

        function renderDuel() {
            container.innerHTML = '';
            if (currentWinner && currentChallenger) {
                const c1 = createCardElement(currentWinner);
                const c2 = createCardElement(currentChallenger);
                container.appendChild(c1);
                container.appendChild(c2);
                
                c1.onclick = () => {
                    c2.classList.add('fly-away');
                    setTimeout(() => {
                        c2.remove();
                        if (poolIndex < currentPool.length) {
                            currentChallenger = currentPool[poolIndex];
                            poolIndex++;
                            renderDuel();
                        } else {
                            showFinal(currentWinner);
                        }
                    }, 400);
                };

                c2.onclick = () => {
                    c1.classList.add('fly-away');
                    setTimeout(() => {
                        c1.remove();
                        if (poolIndex < currentPool.length) {
                            currentWinner = currentPool[poolIndex];
                            poolIndex++;
                            renderDuel();
                        } else {
                            showFinal(currentChallenger);
                        }
                    }, 400);
                };
            }
        }

        function showFinal(movie) {
            container.innerHTML = `<div class="card"><div class="genre">Winner</div><h2>${movie.title}</h2><p>You've found your match!</p></div>`;
            setTimeout(() => {
                document.getElementById('match-overlay').style.display = 'flex';
                document.getElementById('winner-name').innerText = movie.title;
                document.getElementById('save-btn').onclick = () => {
                    saveToFavorites(movie);
                };
            }, 500);
        }

        function saveToFavorites(movie) {
            let favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            const exists = favorites.some(f => f.title === movie.title);
            
            if (!exists) {
                favorites.push({ ...movie, watched: false });
                localStorage.setItem('cineMatch_favs', JSON.stringify(favorites));
                alert("Saved to favorites!");
                document.getElementById('match-overlay').style.display = 'none';
                showCabinet(); 
            } else {
                alert("Already in favorites!");
            }
        }

        function showCabinet() {
            hideAll();
            const list = document.getElementById('cabinet-list');
            const searchInput = document.getElementById('cabinet-search');
            list.innerHTML = '';
            const favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            
            function renderList() {
                const query = searchInput.value.toLowerCase();
                const filtered = favorites.filter(f => 
                    f.title.toLowerCase().includes(query) || 
                    f.genre.toLowerCase().includes(query)
                );

                filtered.sort((a, b) => a.watched - b.watched);

                if (filtered.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">No matches found.</p>';
                } else {
                    list.innerHTML = filtered.map((f) => `
                        <div class="cabinet-item">
                            <div style="flex: 1;">
                                <strong style="color:var(--accent-green)">${f.title}</strong> (${f.year})<br>
                                <small style="color: #888">${f.genre}</small>
                                <p style="font-size:12px; color:#ccc; margin-top:5px;">${f.desc}</p>
                            </div>
                            <div style="display:flex; gap: 5px;">
                                <button 
                                    onclick="toggleWatched('${f.title}')" 
                                    style="padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; background: ${f.watched ? '#555' : '#4CAF50'}; color: white; font-weight: bold; font-size: 12px;">
                                    ${f.watched ? 'Watched' : 'Watch'}
                                </button>
                                <button 
                                    onclick="removeFromFavorites('${f.title}')" 
                                    style="padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent-red); color: white; font-weight: bold; font-size: 12px;">
                                    Delete
                                </button>
                            </div>
                        `).join('');
                }
            }

            searchInput.oninput = renderList;
            renderList();
            document.getElementById('screen-cabinet').classList.add('active');
        }

        function toggleWatched(title) {
            const favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            const movie = favorites.find(f => f.title === title);
            if (movie) {
                movie.watched = !movie.watched;
                localStorage.setItem('cineMatch_favs', JSON.stringify(favorites));
                renderCabinetList();
            }
        }

        function removeFromFavorites(title) {
            let favorites = JSON.parse(localStorage.getItem('cineMatch_favs') || '[]');
            favorites = favorites.filter(f => f.title !== title);
            localStorage.setItem('cineMatch_favs', JSON.stringify(favorites));
            renderCabinetList();
        }

        function closeMatch() {
            document.getElementById('match-overlay').style.display = 'none';
            showHome();
        }

        function showHome() {
            hideAll();
            document.getElementById('screen-home').classList.add('active');
        }

        function showDuel(category) {
            hideAll();
            currentPool = [...movieDatabase[category]];
            poolIndex = 0;
            
            if (currentPool.length >= 2) {
                currentWinner = currentPool[0];
                currentChallenger = currentPool[1];
                currentPool.splice(0, 2);
            } else {
                currentWinner = currentPool[0];
                currentChallenger = currentPool[1] || currentPool[0];
                currentPool = [];
            }

            renderDuel();
            document.getElementById('screen-duel').classList.add('active');
        }

        function hideAll() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        }

        const tg = window.Telegram.WebApp;
        tg.expand();

        // Initialize with dummy data for the UI until you replace it fully
        // The data is currently inside movieDatabase object
        // Let's run the logic
        // We need to handle the fact that script might run before movies.json is loaded in some browsers
        // But for now, since they are in the same file, it's safe.
        showHome();
    </script>
</body>
</html>
